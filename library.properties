sentence=Official Arduino & ESP32/ESP8266/UNO R4 WiFi (UNO Q) Client Library for the IoT Scidi (CIS-IoT) Platform.
paragraph=Connects ESP32, ESP8266, and Arduino UNO R4 WiFi / UNO Q boards to the IoT Scidi (CIS-IoT) platform at Thaksin University. Supports Virtual Pin telemetry (V0-V99), real-time command polling, status reporting, HTTPS insecure client mode, internal campus IP fallback, and ESP32 Watchdog Timer auto-recovery.
